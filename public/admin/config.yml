backend:
    name: github
    repo: Scoobek/wkch_2
    branch: main

# REMOVE before deploying to production
local_backend: true

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
    - name: news
      label: News & Articles
      folder: content/news
      create: true
      slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
      fields:
          - { name: title, label: Title, widget: string }
          - { name: date, label: Date, widget: datetime }
          - { name: excerpt, label: Excerpt, widget: string, required: false }
          - {
                name: thumbnail,
                label: Thumbnail,
                widget: image,
                required: false,
            }
          - {
                name: tag,
                label: Tag,
                widget: select,
                options: [Coursing, Wystawy, Wyścigi, Szkolenia, Meetup, Breed],
                required: false,
            }
          - name: location
            label: Lokalizacja
            widget: object
            required: false
            fields:
                - { name: town, label: Miasto, widget: string, required: false }
                - {
                      name: address,
                      label: Adres,
                      widget: string,
                      required: false,
                  }
                - {
                      name: lat,
                      label: Szerokość geograficzna,
                      widget: number,
                      required: false,
                  }
                - {
                      name: lng,
                      label: Długość geograficzna,
                      widget: number,
                      required: false,
                  }
          - name: images
            label: Galeria
            widget: list
            required: false
            fields:
                - { name: src, label: Zdjęcie, widget: image }
                - {
                      name: alt,
                      label: Tekst alternatywny,
                      widget: string,
                      required: false,
                  }
                - {
                      name: caption,
                      label: Podpis,
                      widget: string,
                      required: false,
                  }
          - { name: body, label: Body, widget: markdown }
